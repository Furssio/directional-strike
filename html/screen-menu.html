<div id="screen-menu">

  <!-- ── DARKEN OVERLAY ── -->
  <div id="menu-overlay"></div>

  <!-- ── PLAYER DECORATIVO ── -->
  <div id="menu-player"></div>

  <!-- ── SPLASH TEXT (angolo alto destra) ── -->
  <div id="menu-splash"></div>

  <!-- ── MENU CONTENT ── -->
  <div id="menu-content">

    <div id="menu-title-block">
      <h1 id="menu-title">DIRECTIONAL<br>STRIKE</h1>
    </div>

    <div id="menu-modes">

      <button class="mode-card mode-play" id="btn-adventure">

        </div>
