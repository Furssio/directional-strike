<div id="screen-menu">
  <div id="menu-card">
    <div class="arrows-preview">← ↑ → ↓</div>
    <h1>Directional Strike</h1>
    <div class="subtitle">choose a mode</div>
    <div class="mode-grid">
      <div class="mode-card" id="btn-infinite" style="display:none;">
        <div class="mode-icon">⚡</div>
        <div class="mode-title">infinite</div>
        <div class="mode-desc">survive as long as possible</div>
      </div>
      <div class="mode-card" id="btn-adventure">
        <div class="mode-icon">⚔️</div>
        <div class="mode-title">adventure</div>
        <div class="mode-desc">complete maps and unlock abilities</div>
      </div>
    </div>
    <button class="game-btn manage-btn" id="btn-abilities">🎯 manage abilities</button>
    <div class="legend">
      <span>👹 1hit</span>
      <span>👾 2hit+shots</span>
      <span>🗿 3hit</span>
      <span>⚡ Space=special</span>
    </div>
    <div class="best-score" id="menu-best"></div>
    <button class="game-btn" id="btn-mute">🔊 audio on</button>
  </div>
</div>
