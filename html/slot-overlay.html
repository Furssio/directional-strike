<!-- ── SLOT MACHINE OVERLAY (global) ── -->
<div id="slot-overlay" class="hidden">
  <div id="slot-darken"></div>
  <div id="slot-card">
    <button id="slot-close-btn" class="slot-close-btn hidden">✕</button>
    <div id="slot-title">NEW ABILITY!</div>
    <div id="slot-subtitle"></div>
    <div id="slot-window">
      <div id="slot-reel-0" class="slot-reel"></div>
      <div id="slot-reel-1" class="slot-reel"></div>
      <div id="slot-reel-2" class="slot-reel"></div>
      <div id="slot-highlight"></div>
    </div>
    <div id="slot-result" class="hidden">
      <div id="slot-result-icon"></div>
      <div id="slot-result-name"></div>
      <div id="slot-result-rarity"></div>
      <div id="slot-result-desc"></div>
    </div>
    <div id="slot-near-miss" class="hidden">
      <div id="slot-near-text">SO CLOSE...</div>
    </div>
    <div id="slot-spin-count"></div>
    <button id="slot-btn" class="slot-btn">SPIN</button>
  </div>
</div>
