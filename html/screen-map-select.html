<div id="screen-map-select">
  <div id="mapselect-player"></div>
  <div id="map-select-wrapper">

    <!-- ── BACK (top left) ── -->
    <button id="btn-map-back" class="map-back-btn">← BACK</button>

    <!-- ── MAP NAME ── -->
    <h2 id="carousel-map-name">Forest</h2>
    <div id="carousel-map-sub"></div>

    <!-- ── CAROUSEL ── -->
    <div id="carousel-container">
      <button id="carousel-prev">&#8249;</button>
      <div id="carousel-track"></div>
      <button id="carousel-next">&#8250;</button>
    </div>

    <!-- ── BOTTOM ── -->
    <div id="carousel-bottom">
      <div id="carousel-completed"></div>
      <div id="carousel-best"></div>
      <button id="btn-map-play">PLAY</button>

      <!-- ── ABILITY PICKER ── -->
      <div id="ability-picker">
        <button id="ability-prev" class="ability-arrow">‹</button>
        <div id="ability-display">
          <span id="ability-pick-icon"></span>
          <span id="ability-pick-name"></span>
        </div>
        <button id="ability-next" class="ability-arrow">›</button>
      </div>
    </div>

    <!-- ── DEMO ARENA (inside wrapper, bottom) ── -->
    <div id="mapselect-demo">
      <div class="demo-player-instance"></div>
    </div>

  </div>
</div>
