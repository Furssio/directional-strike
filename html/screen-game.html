<div id="screen-game">
  <div id="hud">
    <div id="hud-top">
      <div id="score-display">0</div>
      <div id="combo-display"></div>
      <div id="level-display">wave 1</div>
    </div>
    <div id="player-hp-wrap"><div id="player-hp-bar" style="width:100%"></div></div>
    <div id="combo-timer-wrap"><div id="combo-timer-bar"></div></div>
    <div id="special-label">special 0%</div>
    <div id="special-wrap"><div id="special-bar"></div></div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
  </div>
  <div id="arena">
    <div id="flash"></div>
    <div id="attack-range"></div>
    <div id="level-up-pop"></div>
    <div id="boss-announce" class="hidden"></div>
    <div id="special-ring"></div>
    <div id="player">🧑</div>
  </div>
  <div id="controls">
    <div class="cbtn empty"></div>
    <button class="cbtn" id="btn-up">↑</button>
    <div class="cbtn empty"></div>
    <button class="cbtn" id="btn-left">←</button>
    <button class="cbtn" id="btn-special">⚡</button>
    <button class="cbtn" id="btn-right">→</button>
    <div class="cbtn empty"></div>
    <button class="cbtn" id="btn-down">↓</button>
    <div class="cbtn empty"></div>
  </div>
</div>
