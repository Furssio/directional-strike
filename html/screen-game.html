<div id="screen-game">
  <div id="arena">
    <div id="hud">
      <div id="hud-top">
        <div id="score-display">0</div>
        <div id="hud-right">
          <div id="level-display">wave 1</div>
          <button id="btn-pause">
            <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor">
              <rect x="3" y="2" width="4" height="12"/>
              <rect x="9" y="2" width="4" height="12"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div id="flash"></div>
    <div id="attack-range"></div>
    <div id="level-up-pop"></div>
    <div id="boss-announce" class="hidden"></div>
    <div id="special-ring"></div>

    <!-- ── UPGRADE CHOICE OVERLAY ── -->
    <div id="upgrade-choice">
      <div id="upgrade-title">choose your path</div>
      <div class="upgrade-option dir-up" id="upgrade-up"></div>
      <div class="upgrade-option dir-down" id="upgrade-down"></div>
      <div class="upgrade-option dir-left" id="upgrade-left"></div>
      <div class="upgrade-option dir-right" id="upgrade-right"></div>
    </div>

    <!-- ── PIXEL BARS (attached, above player) ── -->
    <div id="player-bars">
      <div id="bar-hp" class="pixel-bar">
        <div class="pixel-bar-border">
          <div class="pixel-bar-bg">
            <div id="player-hp-bar" class="pixel-bar-fill hp-fill"></div>
            <div class="pixel-bar-shine"></div>
          </div>
        </div>
        <div class="pixel-bar-icon">❤️</div>
      </div>
      <div id="bar-special" class="pixel-bar">
        <div class="pixel-bar-border">
          <div class="pixel-bar-bg">
            <div id="special-bar" class="pixel-bar-fill special-fill"></div>
            <div class="pixel-bar-shine"></div>
          </div>
        </div>
        <div class="pixel-bar-icon" id="special-icon">⚡</div>
      </div>
    </div>

    <div id="player">🧑</div>

 <!-- ── GAME OVER OVERLAY ── -->
    <div id="over-overlay" class="hidden">
      <div id="over-darken"></div>
      <div id="over-card">
        <h2 id="over-title">GAME OVER</h2>
        <div id="over-mocking"></div>
        <div id="over-progress"></div>
        <div id="over-stats">
          <span id="over-wave"></span>
          <span id="over-kills"></span>
        </div>
        <div id="over-score-line">
          <span id="over-score-label">SCORE</span>
          <span id="over-score">0</span>
        </div>
        <div id="over-best"></div>
        <div id="over-ad-slot"></div>
        <div class="over-btn-col">
          <button class="over-btn over-btn-primary" id="btn-restart">TRY AGAIN</button>
          <button class="over-btn" id="btn-home">MAPS</button>
        </div>
      </div>
    </div>

    <!-- ── MAP COMPLETE OVERLAY ── -->
    <div id="complete-overlay" class="hidden">
      <div id="complete-darken"></div>
      <div id="complete-card">
        <h2 id="complete-title">MAP COMPLETE!</h2>
        <div id="complete-map-name"></div>
        <div id="complete-score-block">
          <div id="complete-score-label">SCORE</div>
          <div id="complete-score">0</div>
        </div>
        <div id="complete-ability" class="hidden">
          <div id="complete-ability-label">NEW ABILITY UNLOCKED!</div>
          <div id="complete-ability-icon"></div>
          <div id="complete-ability-name"></div>
          <div id="complete-ability-desc"></div>
        </div>
        <div id="complete-ad-slot"></div>
        <div class="complete-btn-col">
          <button class="complete-btn complete-btn-primary" id="btn-play-again">PLAY AGAIN</button>
          <button class="complete-btn" id="btn-complete-maps">MAPS</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── PAUSE OVERLAY ── -->
  <div id="pause-overlay" class="hidden">
    <div id="pause-darken"></div>
    <div id="pause-card">
      <h2 id="pause-title">PAUSED</h2>
      <div class="pause-btn-col">
        <button class="pause-btn pause-btn-primary" id="pause-continue">RESUME</button>
        <button class="pause-btn" id="pause-retry">TRY AGAIN</button>
        <button class="pause-btn" id="pause-maps">MAPS</button>
      </div>
       <div class="pause-volume-row">
        <span class="pause-vol-label">SFX</span>
        <span class="pause-vol-icon">🔇</span>
        <input type="range" id="pause-volume-slider" class="volume-slider"
               min="0" max="100" step="1">
        <span class="pause-vol-icon">🔊</span>
      </div>
      <div class="pause-volume-row">
        <span class="pause-vol-label">MUSIC</span>
        <span class="pause-vol-icon">🔇</span>
        <input type="range" id="pause-music-slider" class="volume-slider"
               min="0" max="100" step="1">
        <span class="pause-vol-icon">🔊</span>
      </div>
    </div>
  </div>
</div>
