<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directional Strike</title>

  <!-- ── FONT (non-blocking) ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"></noscript>

  <!-- ── LOADING (must be first, separate) ── -->
  <link rel="stylesheet" href="css/loading.css">

  <!-- ── ALL GAME CSS (single bundle) ── -->
  <link rel="stylesheet" href="css/game.bundle.css">

  <!-- ── CRAZYGAMES SDK ── -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" onerror="console.warn('[SDK] CrazyGames SDK failed to load — continuing without SDK')"></script>
</head>
<body>
  <script src="js/errorHandler.js"></script>

  <!-- ── LOADING SCREEN (hardcoded, visible immediately) ── -->
  <div id="loading-screen">
    <img id="loading-logo" src="assets/ui/logo.png" alt="Directional Strike">
    <div id="loading-bar-wrap">
      <div id="loading-bar-fill"></div>
    </div>
    <div id="loading-text">LOADING</div>
  </div>

  <!-- ── GAME CONTAINER (hidden until boot complete) ── -->
  <div id="G" style="display:none"></div>

  <script src="js/ui/htmlLoader.js"></script>
</body>
</html>
